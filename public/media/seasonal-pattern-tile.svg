<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MarketFlow seasonal brand pattern">
  <title>Seasonal pattern tile</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="800" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="0.55" stop-color="#6d28d9" />
      <stop offset="1" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
    <!-- One motif, tiled. A seasonal pattern is a repeat by definition, so it
         is authored as a pattern rather than as 64 hand-placed leaves. -->
    <pattern id="motif" width="200" height="200" patternUnits="userSpaceOnUse">
      <path
        d="M100 40c34 22 52 48 52 76 0 30-23 52-52 52s-52-22-52-52c0-28 18-54 52-76Z"
        fill="url(#leafA)"
      />
      <path d="M100 52v112" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" />
      <path d="M100 96 74 76M100 96l26-20M100 132l-26-20M100 132l26-20" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3" stroke-linecap="round" />
      <circle cx="0" cy="0" r="6" fill="#f59e0b" fill-opacity="0.5" />
      <circle cx="200" cy="0" r="6" fill="#f59e0b" fill-opacity="0.5" />
      <circle cx="0" cy="200" r="6" fill="#f59e0b" fill-opacity="0.5" />
      <circle cx="200" cy="200" r="6" fill="#f59e0b" fill-opacity="0.5" />
    </pattern>
  </defs>

  <rect width="800" height="800" fill="url(#ground)" />
  <rect width="800" height="800" fill="url(#motif)" />
  <!-- A slight vignette so the tile still reads as artwork when it is cropped
       into a square thumbnail at 80px. -->
  <rect width="800" height="800" fill="#111827" fill-opacity="0.10" />
</svg>
